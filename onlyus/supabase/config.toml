project_id = "onlyus"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset"]
enable_signup = false              # invitation-only: users are created by the admin
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
